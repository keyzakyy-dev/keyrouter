services:
  keyrouter:
    image: keyzakyy-dev/keyrouter:latest
    container_name: keyrouter
    restart: always
    ports:
      - "20131:20131"
    volumes:
      - keyrouter-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20131"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  keyrouter-data:
    name: keyrouter-data
